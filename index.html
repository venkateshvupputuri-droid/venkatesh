<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Trimble Extension</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
    <header class="header"><h2>📁 My Trimble Extension</h2></header>
    <main class="tab-panel">
        <section class="tab-content active">
            <div class="documents-layout">
                <aside class="left-panel">
                    <div class="left-panel-section-title">Data</div>
                    <div class="left-panel-item">Choose data from Data / Explorer / Completed</div>
                </aside>
                <div class="content-panel">
                    <section class="example-card">
                        <h3>Project Data</h3>
                        <p>Select the required CWA folder and STR IFC file.</p>
                        <div class="form-row">
                            <div class="field">
                                <label for="cwaSelect">CWA</label>
                                <select id="cwaSelect" disabled><option>Connect to load CWA folders…</option></select>
                            </div>
                            <div class="field">
                                <label for="strSelect">STR</label>
                                <select id="strSelect" disabled><option>Connect to load STR files…</option></select>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
        <div class="status-row">
            <button id="connectButton" class="action" type="button">Connect</button>
            <button id="refreshButton" class="action" type="button">Refresh data</button>
        </div>
        <div id="statusMessage" class="status-note">Waiting for Trimble Connect workspace API…</div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>

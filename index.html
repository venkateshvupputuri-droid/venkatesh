<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>My Trimble Extension</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>

<body>

<div class="header">
    <h2>📁 My Trimble Extension</h2>
</div>

<div class="tab-panel">
    <nav class="tabs" aria-label="Extension pages">
        <button class="tab-button active" data-tab="assignment" type="button">Assignment</button>
    </nav>

    <div class="tab-content active" id="assignment">
        <div class="documents-layout">
            <aside class="left-panel">
                <div class="left-panel-section-title">ToDo</div>
                <div class="left-panel-item">ToDo</div>
                <div class="left-panel-item">Project Documents</div>
                <div class="left-panel-item">My Trimble Extension</div>
                <div class="left-panel-item">Trimble API</div>
            </aside>
            <div class="content-panel">
                <section class="example-card">
                    <h3>Assignment</h3>
                    <p>Completed items from Data &gt; Explorer &gt; Completed.</p>
                    <div id="completedData" class="completed-data">Loading completed data...</div>
                </section>
            </div>
        </div>
    </div>

    <div id="statusMessage" class="status-note">Waiting for Trimble Connect workspace API...</div>
</div>

<script type="module" src="app.js"></script>

</body>

</html>

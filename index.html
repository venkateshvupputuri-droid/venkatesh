<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Trimble Extension</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
</head>
<body>
    <main class="tab-panel">
        <section class="tab-content active">
            <div class="content-panel">
                <section class="example-card">
                    <div class="form-row">
                        <div class="field">
                            <label for="cwaSelect">CWA</label>
                            <select id="cwaSelect" disabled>
                                <option>Connect to load CWA folders…</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="strSelect">Model No</label>
                            <select id="strSelect" disabled>
                                <option>Connect to load model files…</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="modelDescription">Str-name</label>
                            <textarea id="modelDescription" rows="3" readonly></textarea>
                        </div>
                    </div>
                </section>
            </div>
        </section>

        <div class="status-row">
            <button id="connectButton" class="action" type="button">Connect</button>
            <button id="refreshButton" class="action" type="button">Refresh data</button>
        </div>
        <div id="statusMessage" class="status-note">Waiting for Trimble Connect workspace API…</div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
